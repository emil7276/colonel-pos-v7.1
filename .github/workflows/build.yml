name: CP POS V7.1

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms android .

      - name: Remove generated default test
        working-directory: app
        run: rm -f test/widget_test.dart
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: dart analyze lib --no-fatal-warnings

  build:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms android .

      - name: Remove generated default test
        working-directory: app
        run: rm -f test/widget_test.dart
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Set Android app label
        working-directory: app
        run: sed -i 's/android:label="[^"]*"/android:label="CP POS v7.1"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        working-directory: app
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CP POS v7.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CP POS v7.1
          path: 'app/build/app/outputs/flutter-apk/CP POS v7.1.apk'
          if-no-files-found: error
