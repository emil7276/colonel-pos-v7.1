name: Colonel POS V7.2

on:
  push:
    branches:
      - main
      - v7.2-retur-partial
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms android .

      - name: Remove generated default test
        working-directory: app
        run: rm -f test/widget_test.dart

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: dart analyze lib --no-fatal-warnings

  build:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms android .

      - name: Remove generated default test
        working-directory: app
        run: rm -f test/widget_test.dart

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Set Android app label
        working-directory: app
        run: sed -i 's/android:label="[^"]*"/android:label="Colonel POS v7.2"/' android/app/src/main/AndroidManifest.xml

      - name: Configure Android release signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo 'Checking signing secrets...'
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo 'Decoding keystore...'
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          echo 'Validating keystore...'
          if keytool -list \
            -keystore android/app/release-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/tmp/keytool-check.log 2>&1; then
            echo 'Keystore valid.'
          else
            cat /tmp/keytool-check.log
            echo '::error::Keystore validation failed. See keytool error above.'
            exit 1
          fi
          echo 'Configuring Gradle signing...'
          cat > /tmp/configure-signing.py <<'PYTHON'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          old = 'signingConfig = signingConfigs.getByName("debug")'
          marker = "    buildTypes {"

          assert s.count(old) == 1, "Baris signing debug tidak ditemukan tepat satu kali"
          assert s.count(marker) == 1, "Blok buildTypes tidak ditemukan tepat satu kali"

          signing = chr(10).join([
              '    signingConfigs {',
              '        create("release") {',
              '            storeFile = file("release-keystore.jks")',
              '            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")',
              '            keyAlias = System.getenv("ANDROID_KEY_ALIAS")',
              '            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")',
              '        }',
              '    }',
              '',
              ''
          ])
          s = s.replace(marker, signing + marker, 1)
          s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(s)
          print("Release signing dikonfigurasi.")
          PYTHON
          python3 /tmp/configure-signing.py

      - name: Build APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK
        working-directory: app
        run: mv "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/colonel-pos-v7.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colonel-pos-v7.2
          path: 'app/build/app/outputs/flutter-apk/colonel-pos-v7.2.apk'
          if-no-files-found: error
